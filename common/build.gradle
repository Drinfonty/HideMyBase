plugins {
	// The Loom plugin id is the one thing that genuinely differs between the 26.x branches
	// and the 1.21 line (fabric-loom-remap), and `plugins {}` requires a literal string, so
	// it cannot come from a property. Everything else here is driven by gradle.properties
	// and is identical across branches.
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.officialMojangMappings()
	compileOnly "org.spongepowered:mixin:0.8.7"

	// Loom's Minecraft jar annotates client-only classes with
	// @net.fabricmc.api.Environment(EnvType.CLIENT). Without fabric-loader on the compile
	// classpath javac cannot resolve that enum and emits "unknown enum constant
	// EnvType.CLIENT" once per annotated class it loads. compileOnly keeps it out of the
	// runtime classpath and out of the published jars, so :neoforge is unaffected - this
	// only gives javac the annotation classes it is already being asked to read.
	compileOnly "net.fabricmc:fabric-loader:${project.loader_version}"

	// The hash, salt derivation and config layers contain no Minecraft classes by design, so the
	// properties that actually matter - determinism, avalanche, per-world separation - are testable
	// in a plain JVM with no game bootstrap.
	testImplementation platform("org.junit:junit-bom:5.13.4")
	testImplementation "org.junit.jupiter:junit-jupiter"
	testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

// The mixin config's compatibilityLevel is the one thing in it that changes between
// branches (JAVA_25 on 26.x, JAVA_21 on the 1.21 line), so it is templated rather than
// forked - the file is byte-identical on every branch and only the property differs.
processResources {
	def mixinCompatLevel = project.mixin_compat_level
	inputs.property "mixinCompatLevel", mixinCompatLevel

	filesMatching("hidemybase.mixins.json") {
		expand "mixinCompatLevel": mixinCompatLevel
	}
}

tasks.named('test') {
	useJUnitPlatform()
	testLogging {
		events "failed"
		exceptionFormat "full"
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = Integer.parseInt(project.java_version)
}

java {
	withSourcesJar()
	toolchain {
		languageVersion = JavaLanguageVersion.of(Integer.parseInt(project.java_version))
	}
}

loom {
	mixin {
		// Pinned rather than left to the Loom default, following the same failure RedFX hit.
		// The mixins live in :common but are packaged and remapped by the platform
		// subprojects; Loom's legacy annotation-processor path writes its refmap into *this*
		// project's build cache while :fabric:remapJar looks under its own, so the refmap is
		// silently dropped and the redirects ship in Mojang names. Hard remapping reads the
		// annotations straight from the bytecode, so it works whichever project compiled the
		// class.
		useLegacyMixinAp = false
	}
}

// This branch remaps; :common's own jar stays in the named namespace so the platform
// subprojects remap exactly once, at :fabric:remapJar.
remapJar {
	targetNamespace = "named"
}
