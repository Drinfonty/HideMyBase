# Per-branch build configuration.
#
# Everything in this file is Minecraft-version specific and is NEVER merged from
# the `shared` branch. Version-agnostic values live in gradle/mod.properties.

# Gradle Memory Settings
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true
org.gradle.configuration-cache=false

# Fabric Properties
minecraft_version=1.21.1
loader_version=0.19.3
modmenu_version=11.0.1
fabric_loader_dependency=>=0.15.0
loom_version=1.14.10

# Java / Mixin
java_version=21
mixin_compat_level=JAVA_21

# Version Metadata
mc_version_suffix=mc1.21.1
minecraft_dependency=>=1.21.0 <1.21.2
neoforge_version=21.1.249
neoforge_dependency=[21.1.0,21.2)
modrinth_game_versions=1.21,1.21.1
