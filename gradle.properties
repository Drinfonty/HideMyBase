# Per-branch build configuration.
#
# Everything in this file is Minecraft-version specific and is NEVER merged from
# the `shared` branch. Version-agnostic values live in gradle/mod.properties.

# Gradle Memory Settings
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true
org.gradle.configuration-cache=false

# Fabric Properties
minecraft_version=1.21.4
loader_version=0.19.3
fabric_loader_dependency=>=0.15.0
loom_version=1.14.10

# Java / Mixin
java_version=21
mixin_compat_level=JAVA_21

# Version Metadata
mc_version_suffix=mc1.21.4
minecraft_dependency=>=1.21.2 <1.21.5
neoforge_version=21.4.157
neoforge_dependency=[21.4.0,21.5)
modrinth_game_versions=1.21.2,1.21.3,1.21.4
