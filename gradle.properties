# Per-branch build configuration.
#
# Everything in this file is Minecraft-version specific and is NEVER merged from
# the `shared` branch. Version-agnostic values live in gradle/mod.properties.

# Gradle Memory Settings
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true
org.gradle.configuration-cache=false

# Fabric Properties
minecraft_version=26.1.2
loader_version=0.19.3
fabric_loader_dependency=>=0.16.0
loom_version=1.17-SNAPSHOT

# Java / Mixin
java_version=25
mixin_compat_level=JAVA_25

# Version Metadata
mc_version_suffix=mc26.1.x
minecraft_dependency=>=26.1.0- <26.2.0
neoforge_version=26.1.2.94
neoforge_dependency=[26.1.0,)
modrinth_game_versions=26.1,26.1.1,26.1.2
