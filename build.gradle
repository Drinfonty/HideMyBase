plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}" apply false
	id 'maven-publish'
	id 'com.modrinth.minotaur' version '2.9.0' apply false
}

// gradle/mod.properties carries the version-agnostic mod identity (mod_version,
// maven_group, the store project ids). It is merged in from the `shared` branch, so a
// release bump is a single edit there instead of one per version branch. Loaded into
// rootProject.ext, which is where subprojects' dynamic property lookup falls back to.
def modProperties = new Properties()
rootProject.file('gradle/mod.properties').withInputStream { modProperties.load(it) }
modProperties.each { k, v -> rootProject.ext.set(k as String, v as String) }

allprojects {
	// Without this project.version is "unspecified", which is what fabric.mod.json's
	// ${version} placeholder would be expanded to.
	version = rootProject.mod_version
	group = rootProject.maven_group

	repositories {
		mavenCentral()
		maven {
			name = "Fabric"
			url = "https://maven.fabricmc.net/"
		}
		maven {
			name = "NeoForge"
			url = "https://maven.neoforged.net/releases/"
		}
	}
}

ext.getModrinthToken = {
	def token = System.getenv("MODRINTH_TOKEN")
	if (token == null || token.isEmpty()) {
		def localPropertiesFile = project.rootProject.file('local.properties')
		if (localPropertiesFile.exists()) {
			def localProperties = new Properties()
			localPropertiesFile.withInputStream { localProperties.load(it) }
			token = localProperties.getProperty('modrinth.token')
		}
	}
	return token
}

// The Modrinth project does not exist yet. Publishing config is skipped entirely until
// modrinth_project_id is set in gradle.properties, so `build` never trips over it.
ext.hasModrinthProject = {
	return rootProject.modrinth_project_id != null && !rootProject.modrinth_project_id.trim().isEmpty()
}
